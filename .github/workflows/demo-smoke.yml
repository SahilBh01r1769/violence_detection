name: Hosted demo smoke test

on:
  push:
    branches:
      - demo/hosted-violence-detection
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: demo/requirements.txt

      - name: Install demo dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/requirements.txt

      - name: Compile demo files
        run: python -m py_compile demo/app.py demo/processor.py core/detector.py config.py

      - name: Run real demo video analysis
        env:
          ENABLE_EMAIL_ALERTS: 'false'
          ENABLE_WHATSAPP_ALERTS: 'false'
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests

          from config import (
              CONFIDENCE_THRESHOLD,
              FRAME_CONSISTENCY,
              MODEL_PATH,
              VIOLENCE_CLASSES,
              VIOLENCE_CLASS_IDS,
          )
          from core.detector import ViolenceDetector
          from demo.processor import analyse_video

          base = (
              'https://raw.githubusercontent.com/airtlab/'
              'A-Dataset-for-Automatic-Violence-Detection-in-Videos/master/'
              'violence-detection-dataset'
          )
          samples = {
              'violent': f'{base}/violent/cam1/1.mp4',
              'non_violent': f'{base}/non-violent/cam1/1.mp4',
          }

          detector = ViolenceDetector(
              model_path=MODEL_PATH,
              confidence=CONFIDENCE_THRESHOLD,
              frame_consistency=FRAME_CONSISTENCY,
              violence_classes=VIOLENCE_CLASSES,
              violence_class_ids=VIOLENCE_CLASS_IDS,
          )

          for name, url in samples.items():
              path = Path(f'/tmp/{name}.mp4')
              response = requests.get(url, timeout=60)
              response.raise_for_status()
              path.write_bytes(response.content)
              summary = analyse_video(
                  path,
                  detector,
                  target_analysis_fps=4.0,
                  max_duration_seconds=15.0,
              )
              assert summary.frames_analyzed > 0
              assert summary.timeline
              assert summary.output_video is None or summary.output_video.exists()
              print(
                  name,
                  {
                      'frames': summary.frames_analyzed,
                      'violent_samples': summary.violent_samples,
                      'alerts': summary.alerts_triggered,
                      'peak_confidence': summary.peak_confidence,
                      'output_video': str(summary.output_video) if summary.output_video else None,
                  },
              )
          PY

      - name: Verify Streamlit app starts
        run: |
          streamlit run demo/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
