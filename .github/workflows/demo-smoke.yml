name: Hosted demo smoke test

on:
  push:
    branches:
      - demo/hosted-violence-detection
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: demo/requirements.txt

      - name: Install demo dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/requirements.txt

      - name: Compile demo files
        run: python -m py_compile demo/app.py demo/processor.py core/detector.py config.py

      - name: Run one real inference
        env:
          ENABLE_EMAIL_ALERTS: 'false'
          ENABLE_WHATSAPP_ALERTS: 'false'
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          import requests

          from config import (
              CONFIDENCE_THRESHOLD,
              FRAME_CONSISTENCY,
              MODEL_PATH,
              VIOLENCE_CLASSES,
              VIOLENCE_CLASS_IDS,
          )
          from core.detector import ViolenceDetector

          sample_url = (
              'https://raw.githubusercontent.com/airtlab/'
              'A-Dataset-for-Automatic-Violence-Detection-in-Videos/master/'
              'violence-detection-dataset/violent/cam1/1.mp4'
          )
          sample_path = Path('/tmp/violent_sample.mp4')
          response = requests.get(sample_url, timeout=60)
          response.raise_for_status()
          sample_path.write_bytes(response.content)

          capture = cv2.VideoCapture(str(sample_path))
          ok, frame = capture.read()
          capture.release()
          if not ok:
              raise RuntimeError('Could not read smoke-test sample frame')

          detector = ViolenceDetector(
              model_path=MODEL_PATH,
              confidence=CONFIDENCE_THRESHOLD,
              frame_consistency=FRAME_CONSISTENCY,
              violence_classes=VIOLENCE_CLASSES,
              violence_class_ids=VIOLENCE_CLASS_IDS,
          )
          result = detector.process_frame(frame)
          print(
              'smoke inference ok:',
              {'detections': len(result.detections), 'class': result.primary_class, 'confidence': result.max_confidence},
          )
          PY
