name: Hosted demo smoke test

on:
  push:
    branches:
      - demo/hosted-violence-detection
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: demo/requirements.txt

      - name: Install demo dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/requirements.txt

      - name: Compile demo files
        run: python -m py_compile demo/app.py demo/processor.py core/detector.py config.py

      - name: Probe violent sample inference cadence
        env:
          ENABLE_EMAIL_ALERTS: 'false'
          ENABLE_WHATSAPP_ALERTS: 'false'
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          import requests

          from config import (
              CONFIDENCE_THRESHOLD,
              FRAME_CONSISTENCY,
              MODEL_PATH,
              VIOLENCE_CLASSES,
              VIOLENCE_CLASS_IDS,
          )
          from core.detector import ViolenceDetector

          url = (
              'https://raw.githubusercontent.com/airtlab/'
              'A-Dataset-for-Automatic-Violence-Detection-in-Videos/master/'
              'violence-detection-dataset/violent/cam1/8.mp4'
          )
          path = Path('/tmp/violent_8.mp4')
          response = requests.get(url, timeout=60)
          response.raise_for_status()
          path.write_bytes(response.content)

          detector = ViolenceDetector(
              model_path=MODEL_PATH,
              confidence=CONFIDENCE_THRESHOLD,
              frame_consistency=FRAME_CONSISTENCY,
              violence_classes=VIOLENCE_CLASSES,
              violence_class_ids=VIOLENCE_CLASS_IDS,
          )

          rows = []
          for target_fps in (4.0, 6.0, 8.0):
              cap = cv2.VideoCapture(str(path))
              fps = cap.get(cv2.CAP_PROP_FPS) or 30.0
              stride = max(1, int(round(fps / target_fps)))
              detector._window.clear()
              detector._frame_id = 0
              idx = sampled = violent = alerts = 0
              while True:
                  ok, frame = cap.read()
                  if not ok:
                      break
                  if idx % stride == 0:
                      result = detector.process_frame(frame)
                      sampled += 1
                      violent += int(result.is_violent)
                      alerts += int(result.alert_triggered)
                  idx += 1
              cap.release()
              row = (target_fps, sampled, violent, alerts)
              rows.append(row)
              print('cadence', row)

          assert max(row[3] for row in rows) > 0, 'Sample did not trigger temporal alert at tested inference rates'
          PY

      - name: Verify Streamlit app starts
        run: |
          streamlit run demo/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
