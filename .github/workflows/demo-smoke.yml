name: Hosted demo smoke test

on:
  push:
    branches:
      - demo/hosted-violence-detection
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: demo/requirements.txt

      - name: Install demo dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/requirements.txt

      - name: Compile demo files
        run: python -m py_compile demo/app.py demo/processor.py core/detector.py config.py

      - name: Probe labelled violent clips for a reliable demo sample
        env:
          ENABLE_EMAIL_ALERTS: 'false'
          ENABLE_WHATSAPP_ALERTS: 'false'
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          import requests

          from config import (
              CONFIDENCE_THRESHOLD,
              FRAME_CONSISTENCY,
              MODEL_PATH,
              VIOLENCE_CLASSES,
              VIOLENCE_CLASS_IDS,
          )
          from core.detector import ViolenceDetector

          base = (
              'https://raw.githubusercontent.com/airtlab/'
              'A-Dataset-for-Automatic-Violence-Detection-in-Videos/master/'
              'violence-detection-dataset/violent/cam1'
          )
          detector = ViolenceDetector(
              model_path=MODEL_PATH,
              confidence=CONFIDENCE_THRESHOLD,
              frame_consistency=FRAME_CONSISTENCY,
              violence_classes=VIOLENCE_CLASSES,
              violence_class_ids=VIOLENCE_CLASS_IDS,
          )

          candidates = []
          for clip_id in range(1, 13):
              path = Path(f'/tmp/violent_{clip_id}.mp4')
              response = requests.get(f'{base}/{clip_id}.mp4', timeout=60)
              response.raise_for_status()
              path.write_bytes(response.content)

              cap = cv2.VideoCapture(str(path))
              fps = cap.get(cv2.CAP_PROP_FPS) or 30.0
              stride = max(1, int(round(fps / 4.0)))
              detector._window.clear()
              detector._frame_id = 0
              idx = 0
              sampled = 0
              violent = 0
              alerts = 0
              peak_violent = 0.0
              while True:
                  ok, frame = cap.read()
                  if not ok:
                      break
                  if idx % stride == 0:
                      result = detector.process_frame(frame)
                      sampled += 1
                      if result.is_violent:
                          violent += 1
                          peak_violent = max(
                              peak_violent,
                              max((d.confidence for d in result.violent_detections), default=0.0),
                          )
                      alerts += int(result.alert_triggered)
                  idx += 1
              cap.release()
              row = (clip_id, sampled, violent, alerts, peak_violent)
              candidates.append(row)
              print('candidate', row)

          best = max(candidates, key=lambda row: (row[2], row[3], row[4]))
          print('BEST_CANDIDATE', best)
          assert best[2] > 0, 'No tested labelled violent clip produced a violence detection'
          PY

      - name: Verify Streamlit app starts
        run: |
          streamlit run demo/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
