services:
  violence-detection:
    build: .
    container_name: violence-detection
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
      - ./models:/app/models
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Linux webcam users can uncomment this block:
    # devices:
    #   - /dev/video0:/dev/video0
