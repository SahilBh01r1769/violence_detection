version: "3.9"

services:

  # ── Detection API + Dashboard ─────────────────────────────────────────────
  violence-detection:
    build: .
    container_name: violence-detection
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"    # FastAPI
      - "8501:8501"    # Streamlit
    volumes:
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
      - ./models:/app/models
    devices:
      # Mount webcam (remove if using RTSP/IP camera)
      - /dev/video0:/dev/video0
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Optional: Nginx reverse proxy ────────────────────────────────────────
  # Uncomment to serve both services behind a single domain
